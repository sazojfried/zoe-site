<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Zoe Friedman — Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta
    name="description"
    content="Photo gallery for Zoe Friedman, Haverford College Economics student and varsity softball athlete."
  />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="images/favicon.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --red: #b31b1b;
      --red-soft: #f97373;
      --bg-page: #f4f5f7;
      --bg-elevated: #ffffff;
      --bg-card: #ffffff;
      --border-subtle: #e2e4ea;
      --text-main: #141414;
      --text-muted: #666a73;
      --shadow-soft: 0 18px 40px rgba(15, 23, 42, 0.14);
    }

    /* Dark theme overrides */
    body.theme-dark {
      --bg-page: #050509;
      --bg-elevated: rgba(5, 5, 9, 0.96);
      --bg-card: #11121a;
      --border-subtle: #26283a;
      --text-main: #f9fafb;
      --text-muted: #9ca3b4;
      --shadow-soft: 0 22px 50px rgba(0, 0, 0, 0.7);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: var(--bg-page);
      color: var(--text-main);
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* NAV (match index/projects) */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border-subtle);
      backdrop-filter: blur(12px);
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    .nav-inner {
      max-width: 1040px;
      margin: 0 auto;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .logo-block {
      text-align: left;
      font-size: 13px;
      line-height: 1.2;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .logo-name {
      font-size: 18px;
      letter-spacing: 0.18em;
    }

    .logo-sub {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-links {
      display: flex;
      gap: 22px;
      font-size: 13px;
      align-items: center;
    }

    .nav-links a {
      position: relative;
      padding-bottom: 4px;
      color: var(--text-muted);
      transition: color 0.2s ease;
    }

    .nav-links a.active,
    .nav-links a:hover {
      color: var(--red-soft);
    }

    .nav-links a.active::after,
    .nav-links a:hover::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      margin: 0 auto;
      width: 80%;
      height: 2px;
      border-radius: 999px;
      background: var(--red-soft);
    }

    .theme-toggle {
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      padding: 5px 10px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease,
        border-color 0.2s ease, transform 0.1s ease;
    }

    .theme-toggle:hover {
      background: rgba(179, 27, 27, 0.09);
      color: var(--text-main);
      border-color: var(--red-soft);
      transform: translateY(-1px);
    }

    .nav-toggle {
      display: none;
      width: 32px;
      height: 32px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: transparent;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .nav-toggle span {
      display: block;
      width: 16px;
      height: 2px;
      border-radius: 999px;
      background: var(--text-muted);
      transition: transform 0.2s ease, opacity 0.2s ease, background 0.2s ease;
    }

    .nav-toggle span + span {
      margin-top: 3px;
    }

    body.nav-open .nav-toggle span:nth-child(1) {
      transform: translateY(5px) rotate(45deg);
    }

    body.nav-open .nav-toggle span:nth-child(2) {
      opacity: 0;
    }

    body.nav-open .nav-toggle span:nth-child(3) {
      transform: translateY(-5px) rotate(-45deg);
    }

    @media (max-width: 780px) {
      .nav-inner {
        align-items: center;
      }

      .nav-right {
        gap: 8px;
      }

      .nav-links {
        position: absolute;
        left: 0;
        right: 0;
        top: 100%;
        background: var(--bg-elevated);
        border-bottom: 1px solid var(--border-subtle);
        padding: 10px 18px 12px;
        display: none;
        flex-direction: column;
        gap: 10px;
        font-size: 13px;
      }

      body.nav-open .nav-links {
        display: flex;
      }

      .theme-toggle {
        font-size: 10px;
        padding: 5px 10px;
      }

      .nav-toggle {
        display: inline-flex;
      }
    }

    /* PAGE HEADER */
    .page-header {
      max-width: 1040px;
      margin: 40px auto 20px;
      padding: 0 18px;
      text-align: center;
    }

    .page-header h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .page-header p {
      color: var(--text-muted);
      font-size: 14px;
    }

    /* GALLERY GRID */
    .gallery {
      max-width: 1040px;
      margin: 0 auto 60px;
      padding: 0 18px;

      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      position: relative;
    }

    .gallery.busy::after {
      content: "Saving…";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      z-index: 10;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 14px;
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      transition: transform 0.2s ease;
    }

    .gallery-item:hover {
      transform: translateY(-4px);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .gallery-delete {
      position: absolute;
      top: 8px;
      right: 8px;
      border: none;
      background: rgba(179, 27, 27, 0.92);
      color: #fff;
      width: 26px;
      height: 26px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
      opacity: 0.92;
      transition: transform 0.12s ease, box-shadow 0.18s ease, opacity 0.12s ease;
    }

    .gallery-delete:hover {
      transform: scale(1.08);
      opacity: 1;
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.35);
    }

    /* ADMIN PANEL */
    .admin-launcher {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 30;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-elevated);
      color: var(--text-main);
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
      transition: transform 0.15s ease, box-shadow 0.2s ease,
        background-color 0.25s ease, border-color 0.25s ease;
    }

    .admin-launcher:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
      border-color: var(--red-soft);
    }

    .admin-panel {
      position: fixed;
      right: 18px;
      bottom: 68px;
      width: min(420px, calc(100% - 24px));
      max-height: 80vh;
      overflow: auto;
      z-index: 40;
      background: var(--bg-elevated);
      color: var(--text-main);
      border-radius: 14px;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.32);
      display: none;
      padding: 16px;
    }

    .admin-panel.open {
      display: block;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .admin-title {
      font-size: 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .admin-close {
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
    }

    .admin-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }

    .admin-row label {
      font-size: 12px;
      color: var(--text-muted);
    }

    .admin-row input[type="password"] {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 13px;
    }

    .admin-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .admin-button {
      flex: 1;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-main);
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: transform 0.15s ease, border-color 0.2s ease,
        background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .admin-button.primary {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
    }

    .admin-button:hover {
      transform: translateY(-1px);
      border-color: var(--red-soft);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
    }

    .admin-alert {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .admin-hidden {
      display: none;
    }

    .draggable-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
  
    footer {
      text-align: center;
      padding: 20px;
      font-size: 11px;
      color: var(--text-muted);
      border-top: 1px solid var(--border-subtle);
      background: var(--bg-elevated);
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }
  </style>
</head>

  <script>
    const ADMIN_PASSWORD = "samandzoe";
    const TOKEN_STORAGE_KEY = "gallery-pat";

    // Footer year
    document.getElementById("year").textContent = new Date().getFullYear();

    const body = document.body;
    const toggleBtn = document.getElementById("theme-toggle");

    function updateToggleLabel() {
      toggleBtn.textContent = body.classList.contains("theme-dark")
        ? "Light mode"
        : "Dark mode";
    }

    toggleBtn.addEventListener("click", () => {
      body.classList.toggle("theme-dark");
      updateToggleLabel();
    });

    updateToggleLabel();

    // Hamburger menu
    const navToggle = document.getElementById("nav-toggle");
    navToggle.addEventListener("click", () => {
      body.classList.toggle("nav-open");
    });

    document.querySelectorAll(".nav-links a").forEach(link => {
      link.addEventListener("click", () => {
        body.classList.remove("nav-open");
      });
    });

    // Gallery data
    const galleryContainer = document.querySelector(".gallery");
    const adminPanel = document.getElementById("admin-panel");
    const adminLauncher = document.getElementById("admin-launcher");
    const adminClose = document.getElementById("admin-close");
    const adminLocked = document.getElementById("admin-locked");
    const adminActionsContainer = document.getElementById("admin-actions");
    const adminPasswordInput = document.getElementById("admin-password");
    const adminAuthBtn = document.getElementById("admin-auth-btn");
    const REPO_CONFIG = {
      owner: "sazojfried",
      repo: "zoe-site",
      branch: "main"
    };
    let cachedToken = localStorage.getItem(TOKEN_STORAGE_KEY) || "";
    const adminStatusEl = document.getElementById("admin-status");

    const uploadFile = document.getElementById("upload-file");
    const uploadAlt = document.getElementById("upload-alt");
    const uploadName = document.getElementById("upload-name");
    const adminUploadBtn = document.getElementById("admin-upload");
    const adminSaveBtn = document.getElementById("admin-save");
    const adminResetBtn = document.getElementById("admin-reset");

    let galleryItems = [];
    let latestSha = "";
    let adminUnlocked = false;
    let isSaving = false;
    let isUploading = false;

    function logStatus(message, isError = false) {
      console.log(message);
      if (adminStatusEl) {
        adminStatusEl.textContent = message;
        adminStatusEl.style.color = isError ? "#b31b1b" : "var(--text-muted)";
      }
    }

    function setGalleryBusy(busy) {
      if (!galleryContainer) return;
      galleryContainer.classList.toggle("busy", busy);
    }

    function setBusyState(type, busy) {
      if (type === "save") isSaving = busy;
      if (type === "upload") isUploading = busy;

      const anyBusy = isSaving || isUploading;

      if (adminSaveBtn) adminSaveBtn.disabled = anyBusy;
      if (adminUploadBtn) adminUploadBtn.disabled = anyBusy;
      if (adminResetBtn) adminResetBtn.disabled = anyBusy;

      setGalleryBusy(anyBusy);

      if (busy) {
        if (type === "save") {
          logStatus("Saving changes to GitHub…");
        } else if (type === "upload") {
          logStatus("Uploading photo and updating gallery…");
        }
      } else if (!anyBusy) {
        logStatus("Ready.");
      }
    }

    function setCachedToken(token) {
      cachedToken = token;
      if (token) {
        localStorage.setItem(TOKEN_STORAGE_KEY, token);
      }
    }

    function renderGallery() {
      galleryContainer.innerHTML = "";
      galleryItems.forEach((item, index) => {
        const wrapper = document.createElement("div");
        wrapper.className = "gallery-item";
        wrapper.dataset.index = index;

        const img = document.createElement("img");
        img.src = item.src;
        img.alt = item.alt || "Gallery image";

        if (adminUnlocked) {
          const deleteBtn = document.createElement("button");
          deleteBtn.className = "gallery-delete";
          deleteBtn.type = "button";
          deleteBtn.textContent = "×";
          deleteBtn.setAttribute("aria-label", "Delete image");
          deleteBtn.setAttribute("draggable", "false");
          deleteBtn.addEventListener("click", (event) => {
            event.stopPropagation();
            event.preventDefault();
            deleteGalleryItem(index);
          });
          wrapper.appendChild(deleteBtn);
        }

        wrapper.appendChild(img);
        galleryContainer.appendChild(wrapper);
      });

      if (adminUnlocked) enableGalleryDrag();
    }

    function deleteGalleryItem(index) {
      if (!ensureUnlocked()) return;
      galleryItems.splice(index, 1);
      renderGallery();
    }

    function enableGalleryDrag() {
      const items = galleryContainer.querySelectorAll(".gallery-item");
      galleryContainer.removeEventListener("dragover", handleGalleryDragOver);
      galleryContainer.addEventListener("dragover", handleGalleryDragOver);

      items.forEach(item => {
        item.setAttribute("draggable", "true");
        item.addEventListener("dragstart", () => {
          item.classList.add("dragging");
        });

        item.addEventListener("dragend", () => {
          item.classList.remove("dragging");
          updateOrderFromGallery();
          renderGallery();
        });
      });
    }

    function handleGalleryDragOver(e) {
      e.preventDefault();
      const draggingItem = galleryContainer.querySelector(".dragging");
      if (!draggingItem) return;

      const afterElement = getGalleryDragAfterElement(e.clientY);
      if (!afterElement) {
        galleryContainer.appendChild(draggingItem);
      } else {
        galleryContainer.insertBefore(draggingItem, afterElement);
      }
    }

    function getGalleryDragAfterElement(y) {
      const draggableElements = [...galleryContainer.querySelectorAll(".gallery-item:not(.dragging)")];

      return draggableElements.reduce(
        (closest, child) => {
          const box = child.getBoundingClientRect();
          const offset = y - box.top - box.height / 2;
          if (offset < 0 && offset > closest.offset) {
            return { offset, element: child };
          }
          return closest;
        },
        { offset: Number.NEGATIVE_INFINITY, element: null }
      ).element;
    }

    function updateOrderFromGallery() {
      const reordered = [];
      galleryContainer.querySelectorAll(".gallery-item").forEach(item => {
        const index = parseInt(item.dataset.index, 10);
        reordered.push(galleryItems[index]);
      });
      galleryItems = reordered;
    }

    async function loadGalleryData() {
      try {
        const response = await fetch("gallery-data.json", { cache: "no-store" });
        if (!response.ok) throw new Error("Unable to load gallery data");
        galleryItems = await response.json();
        logStatus("Loaded gallery-data.json");
      } catch (err) {
        galleryItems = [
          { src: "images/zoe-softball.jpg", alt: "Softball action" },
          { src: "images/zoe-headshot.jpeg", alt: "Zoe headshot" },
          { src: "images/zoe1.jpg", alt: "Zoe photo 1" },
          { src: "images/zoe2.jpg", alt: "Zoe photo 2" },
          { src: "images/zoe3.jpg", alt: "Zoe photo 3" }
        ];
        logStatus(err.message || "Loaded fallback gallery data", true);
      }

      renderGallery();
    }

    function collectRepoSettings() {
      if (!cachedToken) {
        const providedToken =
          prompt(
            "Enter a GitHub personal access token with contents:write scope to save gallery changes"
          )?.trim() || "";

        if (providedToken) {
          setCachedToken(providedToken);
        }
      }

      return {
        ...REPO_CONFIG,
        token: cachedToken
      };
    }

    function ensureUnlocked() {
      if (!adminUnlocked) {
        logStatus("Enter the admin password to enable actions.");
        return false;
      }
      return true;
    }

    function validateSettings(settings) {
      if (!settings.token) {
        logStatus("Provide a GitHub personal access token when prompted.", true);
        return false;
      }
      return true;
    }

   async function getGalleryContent(settings) {
  const url = `https://api.github.com/repos/${settings.owner}/${settings.repo}/contents/gallery-data.json?ref=${settings.branch}`;
  const response = await fetch(url, {
    headers: { Authorization: `Bearer ${settings.token}` }
  });
  if (!response.ok) {
    const errorBody = await response.text();
    const errorMessage = `Unable to read gallery-data.json from repository (status ${response.status}): ${errorBody}`;
    logStatus(errorMessage, true);
    throw new Error(errorMessage);
  }
  const json = await response.json();
  const sha = json.sha;
  const decoded = atob(json.content.replace(/\n/g, ""));
  const items = JSON.parse(decoded);
  return { items, sha };
}

    async function commitGalleryData(settings, updatedItems, message, sha) {
  const contentString = JSON.stringify(updatedItems, null, 2) + "\n";
  const content = btoa(unescape(encodeURIComponent(contentString)));

  const url = `https://api.github.com/repos/${settings.owner}/${settings.repo}/contents/gallery-data.json`;
  const payload = {
    message,
    content,
    sha,                 // << use the sha passed in
    branch: settings.branch
  };

  const response = await fetch(url, {
    method: "PUT",
    headers: {
      Authorization: `Bearer ${settings.token}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify(payload)
  });

  if (!response.ok) {
    const errorBody = await response.text();
    const errorMessage = `Failed to write gallery-data.json (status ${response.status}): ${errorBody}`;
    logStatus(errorMessage, true);
    throw new Error(errorMessage);
  }

  const result = await response.json();
  // If you still want to track latestSha, you can:
  // latestSha = result.content.sha;
}

    async function uploadImage(settings) {
      const file = uploadFile.files[0];
      if (!file) {
        logStatus("Choose an image before uploading.");
        return;
      }

      const targetName = (uploadName.value.trim() || file.name).replace(/\s+/g, "-");

      const reader = new FileReader();
      reader.onload = async () => {
        setBusyState("upload", true);
        try {
          const base64 = reader.result.split(",")[1];
          const url = `https://api.github.com/repos/${settings.owner}/${settings.repo}/contents/images/${targetName}`;

          const payload = {
            message: `Add gallery image ${targetName}`,
            content: base64,
            branch: settings.branch
          };

          const response = await fetch(url, {
            method: "PUT",
            headers: {
              Authorization: `Bearer ${settings.token}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            const errorBody = await response.text();
            const errorMessage = `Image upload failed. Status ${response.status}: ${errorBody}`;
            logStatus(errorMessage, true);
            throw new Error(errorMessage);
          }

          logStatus(`Uploaded ${targetName} to repository.`);

          const updatedItems = [...galleryItems, {
            src: `images/${targetName}`,
            alt: uploadAlt.value.trim() || targetName
          }];

          const sha = await refreshLatestSha(settings);
          await commitGalleryData(
            settings,
            updatedItems,
            `Add ${targetName} to gallery-data.json`,
            sha
          );
          galleryItems = updatedItems;
          renderGallery();

          logStatus("Image added to gallery-data.json");
        } catch (err) {
          logStatus(err.message, true);
        } finally {
          setBusyState("upload", false);
        }
      };

      reader.readAsDataURL(file);
    }

    function readOrderFromGallery() {
      const items = [];
      galleryContainer.querySelectorAll(".gallery-item").forEach(item => {
        const index = parseInt(item.dataset.index, 10);
        items.push(galleryItems[index]);
      });
      return items;
    }

 async function refreshLatestSha(settings) {
  const url = `https://api.github.com/repos/${settings.owner}/${settings.repo}/contents/gallery-data.json?ref=${settings.branch}`;
  const response = await fetch(url, {
    headers: { Authorization: `Bearer ${settings.token}` }
  });
  if (!response.ok) {
    const errorBody = await response.text();
    const errorMessage = `Unable to refresh gallery-data.json sha (status ${response.status}): ${errorBody}`;
    logStatus(errorMessage, true);
    throw new Error(errorMessage);
  }
  const json = await response.json();
  return json.sha;
}


    const setAdminOpen = (open) => {
      if (!adminPanel || !adminLauncher) return;
      adminPanel.classList.toggle("open", open);
      adminLauncher.setAttribute("aria-expanded", open ? "true" : "false");
    };

    adminLauncher?.addEventListener("click", () => setAdminOpen(true));
    adminClose?.addEventListener("click", () => setAdminOpen(false));

    adminAuthBtn?.addEventListener("click", () => {
      const value = adminPasswordInput.value.trim();
      adminUnlocked = value === ADMIN_PASSWORD;
      if (adminUnlocked) {
        adminLocked.style.display = "none";
        adminActionsContainer.style.display = "flex";
        setAdminOpen(true);
        renderGallery();
        logStatus("Admin unlocked. Uploading and reordering enabled.");
      } else {
        logStatus("Incorrect password. Try again.");
      }
    });

    adminPasswordInput?.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        adminAuthBtn.click();
      }
    });

    adminUploadBtn?.addEventListener("click", () => {
      if (!ensureUnlocked()) return;
      uploadFile.value = "";
      uploadFile.click();
    });

    uploadFile?.addEventListener("change", async () => {
      if (!uploadFile.files[0]) return;
      if (!ensureUnlocked()) return;
      uploadAlt.value =
        prompt("Enter alt text for the photo", uploadFile.files[0].name) ||
        uploadFile.files[0].name;
      uploadName.value =
        (prompt(
          "Optional: enter a file name (leave blank to use the selected name)",
          uploadFile.files[0].name
        ) || "").trim();

      const settings = collectRepoSettings();
      if (!validateSettings(settings)) return;
      await uploadImage(settings);
    });

    adminSaveBtn?.addEventListener("click", async () => {
      if (!ensureUnlocked()) return;
      const settings = collectRepoSettings();
      if (!validateSettings(settings)) return;

      setBusyState("save", true);
      try {
        const { items: currentRemoteItems, sha } = await getGalleryContent(settings);
        const proposedItems = readOrderFromGallery();
        const hasChanges =
          JSON.stringify(currentRemoteItems) !== JSON.stringify(proposedItems);

        if (!hasChanges) {
          logStatus("No changes to save.");
          return;
        }

        galleryItems = proposedItems;
        await commitGalleryData(settings, galleryItems, "Update gallery images", sha);
        renderGallery();
        logStatus("Saved new order to repository.");
      } catch (err) {
        logStatus(err.message, true);
      } finally {
        setBusyState("save", false);
      }
    });

    adminResetBtn?.addEventListener("click", () => {
      if (!ensureUnlocked()) return;
      loadGalleryData();
      logStatus("Reloaded gallery data.");
    });

    loadGalleryData();
  </script>
</body>
